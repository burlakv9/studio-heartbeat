name: heartbeat
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          code=$(curl -s -o /dev/null -m 120 -w "%{http_code}" https://lichny-assistent.onrender.com/)
          echo "http_code=$code"
          if [ "$code" != "200" ]; then exit 1; fi
